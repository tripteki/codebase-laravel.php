name: codebase-laravel

x-laravel: &laravel
  image: codebase-laravel:latest
  env_file:
    - path: .env
      required: false
  environment:
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${MYSQL_DATABASE:-codebase}
    DB_USERNAME: ${MYSQL_USER:-codebase}
    DB_PASSWORD: ${MYSQL_PASSWORD:-codebase}
    MM_CLIENT: phpredis
    MM_HOST: redis
    MM_PORT: 6379
    MM_USERNAME: default
    MM_PASSWORD: ${REDIS_PASSWORD:-codebase}
    CACHE_DRIVER: redis
    QUEUE_CONNECTION: redis
    BROADCAST_CONNECTION: reverb
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: 8080
  volumes:
    - laravel-storage:/app/storage/app
  init: true

services:
  app:
    <<: *laravel
    build:
      context: .
    command: ["php", "artisan", "octane:start", "--server=swoole", "--host=0.0.0.0", "--port=8000", "--workers=${OCTANE_WORKERS:-auto}", "--max-requests=${OCTANE_MAX_REQUESTS:-500}"]
    ports:
      - "${OCTANE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8000/up || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  queue:
    <<: *laravel
    command: ["php", "artisan", "queue:work", "redis", "--queue=${QUEUE_NAMES:-user-admin-queue,acl-admin-queue,event-admin-queue,notifications,default}", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    <<: *laravel
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  reverb:
    <<: *laravel
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_PUBLIC_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-codebase}
      MYSQL_USER: ${MYSQL_USER:-codebase}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-codebase}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-codebase-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-codebase}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-codebase}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  laravel-storage:
  mysql-data:
  redis-data:
